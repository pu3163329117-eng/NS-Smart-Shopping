name: Orders Regression (Nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  split-order-regression-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_ja_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        shell: bash
        working-directory: smart-ja-web/server

    env:
      PORT: 3005
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_ja_ci
      JWT_SECRET: ci_jwt_secret_for_regression_only
      ENABLE_LEGACY_MIGRATION: 'false'
      ENABLE_BOOTSTRAP_SEED: 'false'
      ENABLE_SWAGGER: 'false'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-ja-web/server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync database schema
        run: npx prisma db push

      - name: Start API server
        run: |
          nohup node server.js > /tmp/smart-ja-server.log 2>&1 &
          echo $! > /tmp/smart-ja-server.pid

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time."
          cat /tmp/smart-ja-server.log || true
          exit 1

      - name: Run split-order regression workflow
        run: npm run orders:regression-split-workflow -- --base-url=http://127.0.0.1:${PORT} --verbose

      - name: Upload server log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-ja-server-log
          path: /tmp/smart-ja-server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="[FAIL] [Nightly] Orders regression failed
          Repo: ${{ github.repository }}
          Ref: ${{ github.ref_name }}
          Actor: ${{ github.actor }}
          Run: ${RUN_URL}"
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"${TEXT//$'\n'/\\n}\"}"

      - name: Notify Feishu on failure
        if: failure() && secrets.FEISHU_WEBHOOK_URL != ''
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="[FAIL] [Nightly] Orders regression failed
          Repo: ${{ github.repository }}
          Ref: ${{ github.ref_name }}
          Actor: ${{ github.actor }}
          Run: ${RUN_URL}"
          curl -fsS -X POST "$FEISHU_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${TEXT//$'\n'/\\n}\"}}"

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/smart-ja-server.pid ]; then
            kill "$(cat /tmp/smart-ja-server.pid)" || true
          fi
