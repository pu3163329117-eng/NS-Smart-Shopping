version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # For production API domains, set this in your shell:
        # VITE_API_URL=https://api.example.com/api
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: smart-ja-web-frontend:latest
    container_name: smart-ja-web-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
