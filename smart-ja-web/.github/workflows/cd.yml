name: CD — Build & Deploy to Production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/nightly.yml'

  # 允许手动触发
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制重新部署（跳过 CI 检查）'
        required: false
        default: 'false'
        type: boolean

# 同一时间只允许一个部署任务运行
concurrency:
  group: production-deploy
  cancel-in-progress: false   # 不取消正在运行的部署（避免中途中断造成服务不稳定）

jobs:
  # ────────────────────────────────────────
  # 阶段 1: 构建前端静态资源
  # ────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (Production)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: /api

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ────────────────────────────────────────
  # 阶段 2: 构建并推送 Docker 镜像
  # ────────────────────────────────────────
  build-and-push:
    name: 🐋 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-frontend

    permissions:
      contents: read
      packages: write   # 允许推送到 GitHub Container Registry (ghcr.io)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # 构建后端镜像
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建前端镜像（使用已编译的 dist/）
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────
  # 阶段 3: SSH 到 VPS 执行滚动部署
  # ────────────────────────────────────────
  deploy-to-vps:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # 在 GitHub 仓库 Settings → Environments 配置审批规则

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e  # 任何命令失败立即退出
            echo "=== [NS Deploy] Starting deployment $(date) ==="

            # 进入项目目录
            cd ${{ secrets.VPS_PROJECT_PATH }}

            # 拉取最新代码（仅用于获取 docker-compose 配置文件）
            git pull origin main --ff-only

            # 登录 GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取最新镜像
            docker compose --env-file .env.production -f docker-compose.fullstack.yml pull

            # 滚动重启（先起新容器再停旧容器，减少停服时间）
            docker compose --env-file .env.production -f docker-compose.fullstack.yml up -d --remove-orphans

            # 执行数据库迁移（schema 变更自动应用）
            docker compose --env-file .env.production -f docker-compose.fullstack.yml exec -T backend npx prisma db push --skip-generate

            # 清理旧镜像（节省磁盘空间）
            docker image prune -f

            echo "=== [NS Deploy] Deployment complete $(date) ==="

      - name: Health Check
        run: |
          echo "等待服务启动 (15s)..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.VPS_DOMAIN }}/health || echo "000")
          echo "Health check status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed! Status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed!"

  # ────────────────────────────────────────
  # 通知（可选 - 接 Slack/WeChat/钉钉）
  # ────────────────────────────────────────
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy-to-vps]
    if: always()

    steps:
      - name: Notify on Success
        if: needs.deploy-to-vps.result == 'success'
        run: |
          echo "✅ NS Matrix 部署成功！Commit: ${{ github.sha }}"
          # 在此接入飞书/钉钉 Webhook，示例：
          # curl -X POST ${{ secrets.FEISHU_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"msg_type":"text","content":{"text":"✅ NS Matrix 已成功部署！"}}'

      - name: Notify on Failure
        if: needs.deploy-to-vps.result == 'failure'
        run: |
          echo "❌ NS Matrix 部署失败！请立即检查 GitHub Actions 日志"
          # 在此接入飞书/钉钉告警 Webhook
