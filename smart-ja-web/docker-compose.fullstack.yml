services:
  db:
    image: postgres:15-alpine
    container_name: smart-ja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_ja_db}
    volumes:
      - smart_ja_db_data:/var/lib/postgresql/data
    # 生产不暴露 DB 端口到宿主机（安全考虑）
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_ja_db}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: smart-ja-redis
    restart: unless-stopped
    # 生产不暴露 Redis 端口到宿主机
    expose:
      - "6379"
    volumes:
      - smart_ja_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-ja-backend
    restart: unless-stopped
    # 生产不暴露后端端口（由 Nginx 反代）
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-smart_ja_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ENABLE_WALLET_TOPUP: ${ENABLE_WALLET_TOPUP:-false}
      ENABLE_BOOTSTRAP_SEED: ${ENABLE_BOOTSTRAP_SEED:-false}
      ENABLE_LEGACY_MIGRATION: ${ENABLE_LEGACY_MIGRATION:-false}
      ALLOW_DEV_ADMIN_BYPASS: ${ALLOW_DEV_ADMIN_BYPASS:-false}
      INVESTOR_DASHBOARD_PUBLIC: ${INVESTOR_DASHBOARD_PUBLIC:-false}
      GUSHI_ADMIN_IDS: ${GUSHI_ADMIN_IDS:-}
      GUSHI_ADMIN_EMAILS: ${GUSHI_ADMIN_EMAILS:-}
      EXPOSE_DEBUG_SMS_CODE: ${EXPOSE_DEBUG_SMS_CODE:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      UPLOAD_DIR: uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-smart-ja-uploads}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
    volumes:
      - smart_ja_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --skip-generate && node server.js"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    image: smart-ja-web-frontend:latest
    container_name: smart-ja-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # 挂载 Nginx 生产配置（SSL 版本）
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书目录（由 certbot 生成）
      - ${SSL_CERT_PATH:-./nginx/ssl}:/etc/nginx/ssl:ro
      # certbot ACME 验证目录
      - certbot_www:/var/www/certbot:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  # ── 可选：Certbot 自动续签 SSL ──
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: smart-ja-certbot
  #   volumes:
  #     - ${SSL_CERT_PATH:-./nginx/ssl}:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  smart_ja_db_data:
    driver: local
  smart_ja_redis_data:
    driver: local
  smart_ja_uploads:
    driver: local
  certbot_www:
    driver: local
