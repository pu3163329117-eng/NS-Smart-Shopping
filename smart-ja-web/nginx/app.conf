# ============================================================
# Nginx 生产反代配置 — NS Matrix (Smart JA)
# 文件: nginx/app.conf
#
# 功能:
#   - HTTP → HTTPS 301 重定向
#   - SSL/TLS 终止（Let's Encrypt / 自签证书均可）
#   - 前端静态资源服务（带 immutable 缓存头）
#   - /api/* → 后端 Node.js 反向代理
#   - SSE (Server-Sent Events) 支持（AI 流式响应）
#   - 安全响应头（CSP、HSTS、X-Frame-Options 等）
#   - Gzip 压缩
#
# 使用方法：
#   1. 替换下方 YOUR_DOMAIN 为实际域名
#   2. 将 SSL 证书放到 /etc/nginx/ssl/ 目录
#      - 使用 certbot: certbot --nginx -d your-domain.com
#   3. 将此文件挂载到 Nginx 容器：
#      volumes:
#        - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
# ============================================================

# ----------------------------
# HTTP → HTTPS 强制跳转
# ----------------------------
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt ACME 验证通道
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------
# HTTPS 主服务
# ----------------------------
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── SSL 证书配置 ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 前端静态文件 ──
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_proxied any;

    # ── 安全响应头 ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy（按需放开）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.dicebear.com https://image.pollinations.ai; frame-ancestors 'none';" always;

    # ── Vue SPA fallback（必须放在 /api 之前）──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源 immutable 缓存（Vite 构建出的 hash 文件）──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── 字体 / 图标缓存 ──
    location ~* \.(woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── API 反向代理 ──
    location /api/ {
        proxy_pass         http://backend:3005/api/;
        proxy_http_version 1.1;

        # ── SSE (Server-Sent Events) 关键配置 ──
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         300s;    # AI 流式响应最长 5 分钟
        proxy_send_timeout         300s;
        proxy_set_header Connection "";     # 禁止 keep-alive 干扰 SSE

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 速率限制防护（防 DDoS）
        limit_req_status 429;
    }

    # ── 上传文件静态服务（本地 fallback 模式）──
    location /uploads/ {
        proxy_pass         http://backend:3005/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── 健康检测端点 ──
    location /health {
        proxy_pass         http://backend:3005/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── 封锁 Swagger 文档（生产禁止外网访问）──
    location /api-docs {
        return 403;
    }

    # ── 禁止访问隐藏文件 ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── 错误页面 ──
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
